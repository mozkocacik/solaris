<!-- @dsCard group="Patterns" height=760 subtitle="Workspace switcher, search, nav groups, usage and profile" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sidebar</title></head>
<body>
<div id="root">
<div style="display:flex; height: 700px; margin: -16px; border-right: 1px solid var(--border)">
<nav class="sl-sidebar" aria-label="Main">
  <div class="sl-switcher">
    <button type="button" class="sl-switcher__btn" aria-label="Switch workspace, current Northfield Studio"><span class="sl-brand">N</span><span class="sl-trunc" style="flex:1; font-weight:600">Northfield Studio</span><i data-icon="chevron-down" class="sl-icon--sm sl-icon--muted"></i></button>
    <span class="sl-tip"><button type="button" class="sl-iconbtn" aria-label="Collapse sidebar"><i data-icon="panel-left"></i></button><span class="sl-tooltip sl-tooltip--below" role="tooltip">Collapse sidebar</span></span>
  </div>
  <div class="sl-inputbox"><i data-icon="search" class="sl-icon--sm"></i><label class="sl-sr" for="sbp-q">Search</label><input id="sbp-q" type="search" placeholder="Search"><span class="sl-kbd">⌘K</span></div>
  <ul class="sl-nav"><li><button type="button" class="sl-navitem" data-sl-nav aria-current="page"><i data-icon="house" class="sl-icon--nav"></i><span class="sl-navitem__label">Home</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="inbox" class="sl-icon--nav"></i><span class="sl-navitem__label">Inbox</span><span class="sl-countbadge" aria-label="4 unread">4</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="square-check-big" class="sl-icon--nav"></i><span class="sl-navitem__label">My tasks</span><span class="sl-count">3</span></button></li></ul>
  <div class="sl-navlabel"><span>WORKSPACE</span></div>
  <ul class="sl-nav"><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="layers" class="sl-icon--nav"></i><span class="sl-navitem__label">All items</span><span class="sl-count">154</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="users" class="sl-icon--nav"></i><span class="sl-navitem__label">Shared with me</span><span class="sl-count">22</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="clock" class="sl-icon--nav"></i><span class="sl-navitem__label">Recent</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="star" class="sl-icon--nav"></i><span class="sl-navitem__label">Starred</span><span class="sl-count">5</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="archive" class="sl-icon--nav"></i><span class="sl-navitem__label">Archive</span><span class="sl-count">312</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="trash-2" class="sl-icon--nav"></i><span class="sl-navitem__label">Trash</span></button></li></ul>
  <div class="sl-navlabel"><span>GROUPS</span><button type="button" class="sl-iconbtn" aria-label="New group"><i data-icon="plus" class="sl-icon--sm"></i></button></div>
  <ul class="sl-nav"><li><button type="button" class="sl-navitem" aria-expanded="true" data-sl-toggle="sbp-ops"><span class="sl-sq sl-tint--blue">O</span><span class="sl-navitem__label">Operations</span><span class="sl-count">58</span><i data-icon="chevron-right" class="sl-icon--sm sl-navitem__chev"></i></button>
      <ul class="sl-subnav" id="sbp-ops"><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">All items</span><span class="sl-count">58</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Runbooks</span><span class="sl-count">12</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Schedules</span><span class="sl-count">9</span></button></li></ul></li><li><button type="button" class="sl-navitem" aria-expanded="false" data-sl-toggle="sbp-res"><span class="sl-sq sl-tint--orange">R</span><span class="sl-navitem__label">Research</span><span class="sl-count">31</span><i data-icon="chevron-right" class="sl-icon--sm sl-navitem__chev"></i></button>
      <ul class="sl-subnav" id="sbp-res" hidden><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Notes</span><span class="sl-count">17</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Datasets</span><span class="sl-count">14</span></button></li></ul></li><li><button type="button" class="sl-navitem" aria-expanded="true" data-sl-toggle="sbp-par"><span class="sl-sq sl-tint--green">P</span><span class="sl-navitem__label">Partners</span><span class="sl-count">46</span><i data-icon="chevron-right" class="sl-icon--sm sl-navitem__chev"></i></button>
      <ul class="sl-subnav" id="sbp-par"><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Shared resources</span><span class="sl-count">46</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Agreements</span><span class="sl-count">11</span></button></li></ul></li><li><button type="button" class="sl-navitem" aria-expanded="false" data-sl-toggle="sbp-fac"><span class="sl-sq sl-tint--violet">F</span><span class="sl-navitem__label">Facilities</span><span class="sl-count">19</span><i data-icon="chevron-right" class="sl-icon--sm sl-navitem__chev"></i></button>
      <ul class="sl-subnav" id="sbp-fac" hidden><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Sites</span><span class="sl-count">7</span></button></li><li><button type="button" class="sl-navitem" data-sl-nav><span class="sl-navitem__label">Requests</span><span class="sl-count">12</span></button></li></ul></li></ul>
  <div class="sl-spacer" style="min-height: 16px"></div>
  <div class="sl-usage"><div class="sl-usage__row"><b>Storage</b><span>68.4 / 100 GB</span></div>
    <div class="sl-meter" role="meter" aria-label="Storage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68.4" aria-valuetext="68.4 of 100 GB"><span class="sl-fill--blue" style="width:41%"></span><span class="sl-fill--violet" style="width:18%"></span><span class="sl-fill--green" style="width:9%"></span></div></div>
  <ul class="sl-nav"><li><button type="button" class="sl-navitem" data-sl-nav><i data-icon="settings" class="sl-icon--nav"></i><span class="sl-navitem__label">Settings</span></button></li></ul>
  <button type="button" class="sl-profile" aria-label="Account menu, Ines Moreau, online"><span class="sl-avatar sl-avatar--md sl-avatar--p">IM<span class="sl-presence sl-presence--on"></span></span><span class="sl-stack2"><span>Ines Moreau</span><span>Workspace admin</span></span><i data-icon="ellipsis" class="sl-icon--muted"></i></button>
</nav>
</div>
</div>
<script>Solaris.preview({"title": "Sidebar"});</script>
</body>
</html>
