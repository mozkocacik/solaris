<!-- @dsCard group="Data display" height=220 subtitle="Five status tones" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusPill</title></head>
<body>
<div id="root">
<div class="sl-demo">
  <div class="sl-demo__row"><span class="sl-demo__cap">Tones</span>
    <span class="sl-pill"><span class="sl-pill__dot"></span>Draft</span>
    <span class="sl-pill sl-pill--info"><span class="sl-pill__dot"></span>In review</span>
    <span class="sl-pill sl-pill--success"><span class="sl-pill__dot"></span>Approved</span>
    <span class="sl-pill sl-pill--warning"><span class="sl-pill__dot"></span>On hold</span>
    <span class="sl-pill sl-pill--error"><span class="sl-pill__dot"></span>Blocked</span>
  </div>
  <div class="sl-demo__row"><span class="sl-demo__cap">Due</span>
    <span class="sl-pill sl-pill--error">Today</span>
    <span class="sl-pill sl-pill--warning">Tomorrow</span>
    <span class="sl-pill">Oct 24</span>
    <span class="sl-pill sl-pill--success">Current</span>
  </div>
</div>
</div>
<script>Solaris.preview({"title": "StatusPill"});</script>
</body>
</html>
