<!-- @dsCard group="Inputs" height=200 subtitle="Radio group for one choice" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Radio</title></head>
<body>
<div id="root">
<fieldset class="sl-col" style="border:0; padding:0; margin:0">
  <legend class="sl-label" style="margin-bottom: 8px">Link access</legend>
  <label class="sl-choice"><input type="radio" name="ra" class="sl-radio" checked>Members of the workspace</label>
  <label class="sl-choice"><input type="radio" name="ra" class="sl-radio">Only invited people</label>
  <label class="sl-choice"><input type="radio" name="ra" class="sl-radio" disabled>Anyone with the link</label>
</fieldset>
</div>
<script>Solaris.preview({"title": "Radio"});</script>
</body>
</html>
