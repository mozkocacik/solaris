<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pager</title></head>
<body>
<div id="root">
<div class="sl-panel__head" style="border: 1px solid var(--border); border-radius: var(--r-lg); max-width: 310px; animation: none">
  <h3 class="sl-panel__title">Details</h3>
  <button type="button" class="sl-iconbtn sl-iconbtn--xs" aria-label="Previous item"><i data-icon="chevron-left" class="sl-icon--sm"></i></button>
  <span class="sl-pager"><b>02</b> of 10</span>
  <button type="button" class="sl-iconbtn sl-iconbtn--xs" aria-label="Next item"><i data-icon="chevron-right" class="sl-icon--sm"></i></button>
  <button type="button" class="sl-iconbtn sl-iconbtn--sm" aria-label="Close details"><i data-icon="x"></i></button>
</div>
</div>
<script>Solaris.preview({"title": "Pager"});</script>
</body>
</html>
