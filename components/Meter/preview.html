<!-- @dsCard group="Data display" height=200 subtitle="Usage bar with stacked segments" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Meter</title></head>
<body>
<div id="root">
<div class="sl-col" style="max-width: 260px; gap: 16px">
  <div class="sl-usage"><div class="sl-usage__row"><b>Storage</b><span>68.4 / 100 GB</span></div>
    <div class="sl-meter" role="meter" aria-label="Storage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68.4" aria-valuetext="68.4 of 100 GB"><span class="sl-fill--blue" style="width:41%"></span><span class="sl-fill--violet" style="width:18%"></span><span class="sl-fill--green" style="width:9%"></span></div></div>
  <div class="sl-usage"><div class="sl-usage__row"><b>Seats</b><span>18 / 20</span></div>
    <div class="sl-meter" role="meter" aria-label="Seats" aria-valuemin="0" aria-valuemax="20" aria-valuenow="18"><span class="sl-fill--amber" style="width:90%"></span></div></div>
  <div class="sl-col" style="gap:6px"><div class="sl-row" style="justify-content: space-between; font-size: var(--fs-sm)"><span>Monthly quota</span><span class="sl-muted">1,180 / 1,000</span></div>
    <div class="sl-meter sl-meter--lg" role="meter" aria-label="Monthly quota" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="1000" aria-valuetext="1,180 of 1,000, over quota"><span class="sl-fill--red" style="width:100%"></span></div></div>
</div>
</div>
<script>Solaris.preview({"title": "Meter"});</script>
</body>
</html>
