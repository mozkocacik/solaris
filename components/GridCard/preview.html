<!-- @dsCard group="Data display" height=520 subtitle="Preview cards for page, table, diagram, chart, form, collection and other kinds" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>GridCard</title></head>
<body>
<div id="root">
<div class="sl-cardgrid" data-sl-list>
  <div class="sl-card">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Release plan">
      <span class="sl-card__thumb"><span class="sl-mini"><span class="sl-mini__h"></span><span class="sl-mini__s"></span><span class="sl-mini__l" style="width:100%"></span><span class="sl-mini__l" style="width:92%"></span><span class="sl-mini__l" style="width:97%"></span><span class="sl-mini__block"></span><span class="sl-mini__l" style="width:88%"></span><span class="sl-mini__l" style="width:60%"></span></span><span class="sl-live sl-card__live"><span class="sl-live__dot"></span>Priya</span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--blue">PG</span><span class="sl-card__text"><span class="sl-card__name" title="Release plan">Release plan</span><span class="sl-card__meta">Today, 10:02 · 9 pages</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Release plan"></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="false" aria-label="Star Release plan"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Release plan"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
  <div class="sl-card is-open">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Budget lines FY27">
      <span class="sl-card__thumb"><span class="sl-mini sl-tint--green" style="background:var(--paper)"><span class="sl-mini__h"></span><span class="sl-mini__s"></span><span class="sl-mini__rows"><span class="sl-mini__head"></span><span class="sl-mini__row"><i></i><i></i><i class="on"></i></span><span class="sl-mini__row"><i></i><i></i><i></i></span><span class="sl-mini__row"><i></i><i class="on"></i><i></i></span><span class="sl-mini__row"><i></i><i></i><i></i></span></span></span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--green">TB</span><span class="sl-card__text"><span class="sl-card__name" title="Budget lines FY27">Budget lines FY27</span><span class="sl-card__meta">Yesterday · 418 rows</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Budget lines FY27"></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="false" aria-label="Star Budget lines FY27"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Budget lines FY27"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
  <div class="sl-card">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Approval flow">
      <span class="sl-card__thumb"><span class="sl-mini"><span class="sl-mini__h"></span><span class="sl-mini__s"></span><span class="sl-mini__canvas"><i style="left:12%;top:20%;width:28%;height:38%"></i><i style="left:58%;top:16%;width:26%;height:30%"></i><i style="left:40%;top:64%;width:24%;height:24%"></i><b style="left:40%;top:38%;width:18%"></b></span></span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--violet">DG</span><span class="sl-card__text"><span class="sl-card__name" title="Approval flow">Approval flow</span><span class="sl-card__meta">Oct 15 · 22 nodes</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Approval flow"></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="false" aria-label="Star Approval flow"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Approval flow"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
  <div class="sl-card is-checked">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Weekly metrics">
      <span class="sl-card__thumb"><span class="sl-mini sl-tint--orange" style="background:var(--paper)"><span class="sl-mini__h"></span><span class="sl-mini__s"></span><span class="sl-mini__bars"><i style="height:40%"></i><i style="height:65%"></i><i style="height:50%"></i><i style="height:85%"></i><i style="height:70%"></i><i style="height:95%"></i></span></span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--orange">RP</span><span class="sl-card__text"><span class="sl-card__name" title="Weekly metrics">Weekly metrics</span><span class="sl-card__meta">Oct 13 · 6 charts</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Weekly metrics" checked></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="false" aria-label="Star Weekly metrics"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Weekly metrics"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
  <div class="sl-card">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Access request">
      <span class="sl-card__thumb"><span class="sl-mini"><span class="sl-mini__h"></span><span class="sl-mini__s"></span><span class="sl-mini__l" style="width:40%;margin-top:4px"></span><span class="sl-mini__field"></span><span class="sl-mini__l" style="width:30%"></span><span class="sl-mini__field"></span><span class="sl-mini__l" style="width:46%"></span><span class="sl-mini__field"></span></span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--amber">FM</span><span class="sl-card__text"><span class="sl-card__name" title="Access request">Access request</span><span class="sl-card__meta">Oct 11 · 54 replies</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Access request"></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="true" aria-label="Star Access request"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Access request"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
  <div class="sl-card">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Archive 2025">
      <span class="sl-card__thumb"><span class="sl-mini-stack"><i></i><i></i><b></b></span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--neutral">CL</span><span class="sl-card__text"><span class="sl-card__name" title="Archive 2025">Archive 2025</span><span class="sl-card__meta">Oct 2 · 312 items</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Archive 2025"></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="false" aria-label="Star Archive 2025"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Archive 2025"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
  <div class="sl-card">
    <button type="button" class="sl-card__main" data-sl-peek="gc-none" aria-label="Show details for Raw export">
      <span class="sl-card__thumb"><span class="sl-mini-icon"><i data-icon="box"></i></span></span>
      <span class="sl-card__foot"><span class="sl-typebadge sl-typebadge--sm sl-typebadge--neutral">BIN</span><span class="sl-card__text"><span class="sl-card__name" title="Raw export">Raw export</span><span class="sl-card__meta">Sep 30 · 18.4 MB</span></span></span>
    </button>
    <label class="sl-card__check"><input type="checkbox" class="sl-check" data-sl-select aria-label="Select Raw export"></label>
    <span class="sl-card__actions"><button type="button" class="sl-floatbtn sl-star" data-sl-star aria-pressed="false" aria-label="Star Raw export"><i data-icon="star" class="sl-icon--sm"></i></button><button type="button" class="sl-floatbtn" aria-label="Open Raw export"><i data-icon="arrow-up-right" class="sl-icon--sm"></i></button></span>
  </div>
</div>
</div>
<script>Solaris.preview({"mode": "single", "layout": "rows", "title": "GridCard", "bg": false});</script>
</body>
</html>
