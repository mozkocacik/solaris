<!doctype html>
<html>
<head><meta charset="utf-8"><title>Textarea</title></head>
<body>
<div id="root">
<div class="sl-demo" style="max-width: 320px">
  <div class="sl-field"><label class="sl-label" for="ta1">Description<span class="sl-label__opt">Optional</span></label><textarea id="ta1" class="sl-textarea" rows="3" placeholder="Add a description"></textarea></div>
  <div class="sl-field"><label class="sl-label" for="ta2">Reason for change</label><textarea id="ta2" class="sl-textarea" rows="2" aria-invalid="true" aria-describedby="ta2e"></textarea><span class="sl-error" id="ta2e"><i data-icon="circle-alert" class="sl-icon--sm"></i>Enter a reason.</span></div>
</div>
</div>
<script>Solaris.preview({"title": "Textarea"});</script>
</body>
</html>
