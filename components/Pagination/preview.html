<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pagination</title></head>
<body>
<div id="root">
<div class="sl-demo">
  <div class="sl-pagination"><span>10 of 46 items</span><div class="sl-pagination__nav">
    <button type="button" class="sl-pagebtn" aria-label="Previous page" disabled><i data-icon="chevron-left" class="sl-icon--sm"></i></button>
    <button type="button" class="sl-pagebtn" aria-label="Next page"><i data-icon="chevron-right" class="sl-icon--sm"></i></button></div></div>
  <div class="sl-pagination"><span>41–46 of 46 items</span><div class="sl-pagination__nav">
    <button type="button" class="sl-pagebtn" aria-label="Previous page"><i data-icon="chevron-left" class="sl-icon--sm"></i></button>
    <button type="button" class="sl-pagebtn" aria-label="Next page" disabled><i data-icon="chevron-right" class="sl-icon--sm"></i></button></div></div>
</div>
</div>
<script>Solaris.preview({"title": "Pagination"});</script>
</body>
</html>
