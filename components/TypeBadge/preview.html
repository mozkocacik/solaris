<!-- @dsCard group="Data display" height=200 subtitle="Mono type code on a category tint" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TypeBadge</title></head>
<body>
<div id="root">
<div class="sl-demo">
  <div class="sl-demo__row"><span class="sl-demo__cap">Tints</span>
    <span class="sl-typebadge sl-typebadge--blue" title="Page">PG</span>
    <span class="sl-typebadge sl-typebadge--green" title="Table">TB</span>
    <span class="sl-typebadge sl-typebadge--amber" title="Form">FM</span>
    <span class="sl-typebadge sl-typebadge--red" title="Report">RP</span>
    <span class="sl-typebadge sl-typebadge--violet" title="Diagram">DG</span>
    <span class="sl-typebadge sl-typebadge--orange" title="Dataset">DS</span>
    <span class="sl-typebadge sl-typebadge--neutral" title="Collection">CL</span>
  </div>
  <div class="sl-demo__row"><span class="sl-demo__cap">Sizes</span>
    <span class="sl-typebadge sl-typebadge--sm sl-typebadge--green">TB</span>
    <span class="sl-typebadge sl-typebadge--green">TB</span>
    <span class="sl-typebadge sl-typebadge--lg sl-typebadge--green">TB</span>
    <span class="sl-typebadge sl-typebadge--lg sl-typebadge--neutral">CL</span>
  </div>
</div>
</div>
<script>Solaris.preview({"title": "TypeBadge"});</script>
</body>
</html>
