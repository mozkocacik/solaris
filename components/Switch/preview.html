<!-- @dsCard group="Inputs" height=200 subtitle="On/off setting that applies at once" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch</title></head>
<body>
<div id="root">
<div class="sl-col" style="max-width: 320px">
  <label class="sl-choice" style="justify-content: space-between"><span>Email digest</span><input type="checkbox" role="switch" class="sl-switch" checked></label>
  <label class="sl-choice" style="justify-content: space-between"><span>Show archived items</span><input type="checkbox" role="switch" class="sl-switch"></label>
  <label class="sl-choice" style="justify-content: space-between"><span>Single sign-on</span><input type="checkbox" role="switch" class="sl-switch" disabled checked></label>
  <label class="sl-choice" style="justify-content: space-between"><span>Focus</span><input type="checkbox" role="switch" class="sl-switch sl-force-focus"></label>
</div>
</div>
<script>Solaris.preview({"title": "Switch"});</script>
</body>
</html>
