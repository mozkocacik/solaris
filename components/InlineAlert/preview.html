<!-- @dsCard group="Overlays" height=220 subtitle="Errors and blocking warnings inside content" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>InlineAlert</title></head>
<body>
<div id="root">
<div class="sl-col" style="max-width: 520px; gap: 10px">
  <div class="sl-alert sl-alert--error" role="alert"><i data-icon="circle-alert"></i><div class="sl-alert__body"><span class="sl-alert__title">This collection could not load</span><span>Check your connection and try again.</span></div><button type="button" class="sl-btn sl-btn--sm"><i data-icon="refresh-cw" class="sl-icon--sm"></i>Retry</button></div>
  <div class="sl-alert sl-alert--warning" role="status"><i data-icon="triangle-alert"></i><div class="sl-alert__body"><span class="sl-alert__title">Storage is 95% full</span><span>New uploads stop at 100 GB.</span></div><button type="button" class="sl-btn sl-btn--sm">Manage</button></div>
</div>
</div>
<script>Solaris.preview({"title": "InlineAlert"});</script>
</body>
</html>
