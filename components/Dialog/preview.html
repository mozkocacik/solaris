<!-- @dsCard group="Overlays" height=380 subtitle="Modal dialog with header, body and footer" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div id="root">
<div style="position: relative; min-height: 330px; border-radius: var(--r-lg); overflow: hidden">
  <div class="sl-backdrop" data-sl-modal style="padding-top: 24px">
    <div class="sl-dialog" role="dialog" aria-modal="true" aria-labelledby="dl1t">
      <div class="sl-dialog__head"><h2 class="sl-dialog__title" id="dl1t">New collection</h2><button type="button" class="sl-iconbtn sl-iconbtn--sm" aria-label="Close" data-sl-close><i data-icon="x"></i></button></div>
      <div class="sl-dialog__body">
        <div class="sl-field"><label class="sl-label" for="dl1n">Name</label><input id="dl1n" class="sl-input sl-input--lg" type="text" value="Site visits 2026"></div>
        <div class="sl-field"><label class="sl-label" for="dl1g">Group</label><span class="sl-select"><select id="dl1g"><option>Facilities</option><option>Operations</option></select><i data-icon="chevrons-up-down" class="sl-icon--sm"></i></span></div>
      </div>
      <div class="sl-dialog__foot"><span class="sl-spacer"></span><button type="button" class="sl-btn" data-sl-close>Cancel</button><button type="button" class="sl-btn sl-btn--primary">Create</button></div>
    </div>
  </div>
</div>
</div>
<script>Solaris.preview({"mode": "single", "title": "Dialog"});</script>
</body>
</html>
