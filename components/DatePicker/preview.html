<!-- @dsCard group="Inputs" height=400 subtitle="Date input with calendar popover" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DatePicker</title></head>
<body>
<div id="root">
<div class="sl-field" style="max-width: 260px">
  <label class="sl-label" for="dp1">Due date</label>
  <div class="sl-inputbox"><i data-icon="calendar" class="sl-icon--sm"></i><input id="dp1" type="text" value="Oct 22, 2026" aria-haspopup="dialog" aria-expanded="true"></div>
  <div class="sl-popover sl-popover--flush" role="dialog" aria-label="Choose a date" style="position: static; width: max-content; margin-top: 2px">
    <div class="sl-cal">
      <div class="sl-cal__head"><span class="sl-cal__title">October 2026</span>
        <button type="button" class="sl-iconbtn sl-iconbtn--xs" aria-label="Previous month"><i data-icon="chevron-left" class="sl-icon--sm"></i></button>
        <button type="button" class="sl-iconbtn sl-iconbtn--xs" aria-label="Next month"><i data-icon="chevron-right" class="sl-icon--sm"></i></button></div>
      <div class="sl-cal__grid" role="grid" id="dp1-grid"></div>
    </div>
  </div>
</div>
</div>
<script>Solaris.preview({"title": "DatePicker", "after": function(r){ r.querySelectorAll(".sl-cal__grid").forEach(function(g){ var h=""; ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(function(d){ h+='<span class="sl-cal__dow" aria-hidden="true">'+d+'</span>'; }); for(var i=0;i<35;i++){ var day=i-2; var out=day<1||day>31; var n=day<1?30+day:(day>31?day-31:day); var a=""; if(day===17)a=' aria-current="date"'; if(day===22)a=' aria-selected="true"'; h+='<button type="button" class="sl-cal__day"'+(out?' data-out':'')+a+' aria-label="October '+n+', 2026">'+n+'</button>'; } g.innerHTML=h; }); }});</script>
</body>
</html>
