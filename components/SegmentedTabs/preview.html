<!-- @dsCard group="Navigation" height=200 subtitle="List filters with icon, label and count" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedTabs</title></head>
<body>
<div id="root">
<div class="sl-demo">
  <div class="sl-tabs" role="tablist" aria-label="Filter records">
    <button type="button" class="sl-tab" role="tab" aria-selected="true"><i data-icon="layers" class="sl-icon--sm"></i>All<span class="sl-count">128</span></button>
    <button type="button" class="sl-tab" role="tab" aria-selected="false" tabindex="-1"><i data-icon="user" class="sl-icon--sm"></i>Assigned to me<span class="sl-count">14</span></button>
    <button type="button" class="sl-tab" role="tab" aria-selected="false" tabindex="-1"><i data-icon="clock" class="sl-icon--sm"></i>Due soon<span class="sl-count">6</span></button>
    <button type="button" class="sl-tab" role="tab" aria-selected="false" tabindex="-1"><i data-icon="archive" class="sl-icon--sm"></i>Archived<span class="sl-count">31</span></button>
  </div>
</div>
</div>
<script>Solaris.preview({"title": "SegmentedTabs"});</script>
</body>
</html>
