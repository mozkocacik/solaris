<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Solaris</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .sun { fill: var(--amber); }
  .orbit { fill: none; stroke: var(--border-strong); stroke-width: 1; }
  .planet { fill: var(--blue); }
  .ok { fill: var(--green-bg); }
  .okdot { fill: var(--green); }
  .words { position: absolute; left: var(--space-32); bottom: var(--space-32); max-width: 440px; }
  .name { margin: 0; font-size: 112px; line-height: .9; font-weight: 600; letter-spacing: -0.04em; color: var(--text); }
  .tag { margin: var(--space-12) 0 0 4px; font-size: 13px; line-height: 20px; color: var(--text-3); }
</style>
</head>
<body>
<!-- The cover is always dark, the same as the Vesper and Meridian covers in the dark theme. -->
<div class="cover t-dark" data-theme="dark">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      amber sun r=96 · one blue planet r=8 on the middle orbit · green-bg pill 80x28 (status stays small) ≈ 26% of 960x288
  arrangement one sun in the middle of the art box; one small planet toward the name; one small status pill below-left; lots of dark ground
  pattern     literal motif, the system's name: a sun with three orbits in border-strong at 1px, cut by the frame
  scales      orbit step 28; pill radius half its 28px height; gaps space-16 and space-32
-->
<circle class="orbit" cx="316" cy="144" r="140"/>
<circle class="orbit" cx="316" cy="144" r="168"/>
<circle class="orbit" cx="316" cy="144" r="196"/>
<circle class="sun" cx="316" cy="144" r="96"/>
<circle class="planet" cx="166" cy="68" r="8"/>
<rect class="ok" x="16" y="228" width="80" height="28" rx="14"/>
<circle class="okdot" cx="34" cy="242" r="3"/>
</svg>
</div>
<div class="words">
<h1 class="name">Solaris</h1>
<p class="tag">Calm, dense interfaces for data-heavy work.</p>
</div>
</div>
</body>
</html>
