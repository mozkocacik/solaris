<!-- @dsCard group="Inputs" height=300 subtitle="Single-line text input with label" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextInput</title></head>
<body>
<div id="root">
<div class="sl-demo" style="max-width: 300px">
  <div class="sl-field"><label class="sl-label" for="ti1">Collection name</label><input id="ti1" class="sl-input" type="text" value="Field inventory 2026"></div>
  <div class="sl-field"><label class="sl-label" for="ti2">Reference<span class="sl-label__opt">Optional</span></label><input id="ti2" class="sl-input" type="text" placeholder="REC-0000"></div>
  <div class="sl-field"><label class="sl-label" for="ti3">Hover</label><input id="ti3" class="sl-input sl-force-hover" type="text" value="Partners"></div>
  <div class="sl-field"><label class="sl-label" for="ti4">Focus</label><input id="ti4" class="sl-input sl-force-focus" type="text" value="Quarterly review"></div>
  <div class="sl-field"><label class="sl-label" for="ti5">Read only</label><input id="ti5" class="sl-input" type="text" value="REC-20418" readonly></div>
  <div class="sl-field"><label class="sl-label" for="ti6">Disabled</label><input id="ti6" class="sl-input" type="text" value="Managed by workspace" disabled></div>
</div>
</div>
<script>Solaris.preview({"title": "TextInput"});</script>
</body>
</html>
