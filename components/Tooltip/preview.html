<!-- @dsCard group="Overlays" height=170 subtitle="Short label for icon buttons" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip</title></head>
<body>
<div id="root">
<div class="sl-demo__row" style="padding-top: 34px; gap: 28px">
  <span class="sl-tip"><button type="button" class="sl-iconbtn" aria-label="Download"><i data-icon="download" class="sl-icon--lg"></i></button><span class="sl-tooltip is-shown" role="tooltip">Download</span></span>
  <span class="sl-tip"><button type="button" class="sl-iconbtn" aria-label="Search"><i data-icon="search" class="sl-icon--lg"></i></button><span class="sl-tooltip is-shown" role="tooltip">Search <span class="sl-kbd">⌘K</span></span></span>
  <span class="sl-tip"><button type="button" class="sl-iconbtn" aria-label="Archive"><i data-icon="archive" class="sl-icon--lg"></i></button><span class="sl-tooltip" role="tooltip">Archive</span></span>
  <span class="sl-tip"><span class="sl-avatar sl-avatar--md sl-avatar--b" tabindex="0" aria-label="Hana Sato">HS</span><span class="sl-tooltip sl-tooltip--below" role="tooltip">Hana Sato</span></span>
</div>
</div>
<script>Solaris.preview({"title": "Tooltip"});</script>
</body>
</html>
