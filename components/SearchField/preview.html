<!doctype html>
<html>
<head><meta charset="utf-8"><title>SearchField</title></head>
<body>
<div id="root">
<div class="sl-demo" style="max-width: 280px">
  <div class="sl-inputbox"><i data-icon="search" class="sl-icon--sm"></i><label for="sf1" class="sl-sr">Search</label><input id="sf1" type="search" placeholder="Search"><span class="sl-kbd">⌘K</span></div>
  <div class="sl-inputbox"><i data-icon="search" class="sl-icon--sm"></i><label for="sf2" class="sl-sr">Search members</label><input id="sf2" type="search" value="ok"><button type="button" class="sl-chip__x" aria-label="Clear search"><i data-icon="x" class="sl-icon--sm"></i></button></div>
  <div class="sl-inputbox sl-force-focus"><i data-icon="search" class="sl-icon--sm"></i><label for="sf3" class="sl-sr">Search in collection</label><input id="sf3" type="search" placeholder="Search in Partners"></div>
</div>
</div>
<script>Solaris.preview({"title": "SearchField"});</script>
</body>
</html>
